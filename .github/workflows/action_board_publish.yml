name: Alpha Hunter Action Board Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Alpha Hunter Portfolio Maintenance Recovery"
      - "Alpha Hunter Decision Refresh"
    types: [completed]

concurrency:
  group: alpha-hunter-action-board-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test advisory and V2 entry contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Build CIO advisory layer
        run: python cio_advisory.py

      - name: Build global risk regime and cash target
        run: python risk_regime.py

      # Preserve current public V1 advisory artifacts during V2 shadow rollout.
      - name: Build legacy portfolio allocation advisory
        run: python portfolio_allocation_advisory.py

      - name: Build legacy Global Alignment Leaderboard
        run: python global_alignment.py

      - name: Build Global Alignment V2
        run: python global_alignment_v2.py

      - name: Build canonical Exact Entry V2 plans
        env:
          ALPHA_HUNTER_RISK_POLICY_JSON: ${{ secrets.ALPHA_HUNTER_RISK_POLICY_JSON }}
          ALPHA_HUNTER_PORTFOLIO_JSON: ${{ secrets.ALPHA_HUNTER_PORTFOLIO_JSON }}
        run: python entry_plan_run_v2.py

      - name: Build Rotation V2 using the same canonical entry plans
        run: python portfolio_allocation_v2.py

      - name: Build privacy-safe legacy one-page action board
        run: python action_board_summary.py

      - name: Prepend legacy Global Alignment summary
        run: python global_alignment_summary.py

      - name: Prepend legacy portfolio allocation summary
        run: python portfolio_allocation_summary.py

      - name: Prepend V2 A-E Global Alignment and Exact Entry summary
        run: python entry_action_board_v2.py

      - name: Commit advisory and action board
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            output/cio_advisory.csv \
            output/cio_advisory.json \
            output/risk_regime.json \
            output/portfolio_allocation_advisory.json \
            output/global_alignment.csv \
            output/global_alignment.json \
            output/global_alignment_v2.csv \
            output/global_alignment_v2.json \
            output/entry_plans_v2.json \
            output/portfolio_allocation_v2.json \
            output/action_board.md
          if [ -e output/entry_plans_v2.csv ] || git ls-files --error-unmatch output/entry_plans_v2.csv >/dev/null 2>&1; then
            git add -A output/entry_plans_v2.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "publish alpha hunter v2 exact-entry advisory $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
