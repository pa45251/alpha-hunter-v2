name: Alpha Hunter Action Board Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Alpha Hunter Portfolio Maintenance Recovery"
      - "Alpha Hunter Decision Refresh"
    types: [completed]

concurrency:
  group: alpha-hunter-action-board-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test advisory contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_risk_regime.py tests/test_portfolio_allocation_advisory.py tests/test_global_alignment.py

      - name: Build CIO advisory layer
        run: python cio_advisory.py

      - name: Build global risk regime and cash target
        run: python risk_regime.py

      - name: Build portfolio rotation and allocation advisory
        run: python portfolio_allocation_advisory.py

      - name: Build Global Alignment Leaderboard
        run: python global_alignment.py

      - name: Build privacy-safe one-page action board
        run: python action_board_summary.py

      - name: Prepend Global Alignment summary
        run: python global_alignment_summary.py

      - name: Prepend portfolio allocation summary
        run: python portfolio_allocation_summary.py

      - name: Commit advisory and action board
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            output/cio_advisory.csv \
            output/cio_advisory.json \
            output/risk_regime.json \
            output/portfolio_allocation_advisory.json \
            output/global_alignment.csv \
            output/global_alignment.json \
            output/action_board.md
          if ! git diff --cached --quiet; then
            git commit -m "publish alpha hunter portfolio and global alignment advisory $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
