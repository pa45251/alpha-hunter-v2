name: Alpha Hunter Action Board Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'global_alignment_v2.py'
      - 'entry_structure_v2.py'
      - 'entry_plan_run_v2.py'
      - 'entry_plan_trace_v2.py'
      - 'portfolio_risk_v2.py'
      - 'portfolio_allocation_v2.py'
      - 'entry_action_board_v2.py'
      - '.github/workflows/action_board_publish.yml'
  workflow_run:
    workflows:
      - "Alpha Hunter v3 Autonomous Research"
      - "Alpha Hunter Portfolio Maintenance Recovery"
      - "Alpha Hunter Decision Refresh"
    types: [completed]

concurrency:
  group: alpha-hunter-action-board-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish one canonical V2 action board
        env:
          ALPHA_HUNTER_RISK_POLICY_JSON: ${{ secrets.ALPHA_HUNTER_RISK_POLICY_JSON }}
          ALPHA_HUNTER_PORTFOLIO_JSON: ${{ secrets.ALPHA_HUNTER_PORTFOLIO_JSON }}
          ALPHA_HUNTER_POSITION_ALIAS_JSON: ${{ secrets.ALPHA_HUNTER_POSITION_ALIAS_JSON }}
        run: python action_board_summary.py --refresh

      - name: Commit advisory, trace and action board
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            output/cio_advisory.csv \
            output/cio_advisory.json \
            output/risk_regime.json \
            output/position_cio_advisory.json \
            output/global_alignment_v2.csv \
            output/global_alignment_v2.json \
            output/entry_plans_v2.json \
            output/entry_plan_trace_v2.csv \
            output/portfolio_allocation_v2.json \
            output/action_board.md
          if [ -e output/entry_plans_v2.csv ] || git ls-files --error-unmatch output/entry_plans_v2.csv >/dev/null 2>&1; then
            git add -A output/entry_plans_v2.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m "publish alpha hunter frozen v2 exact-entry trace $(date -u +%F)"
            git push origin HEAD:main
          fi
