name: Alpha Hunter Action Board Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Alpha Hunter Portfolio Maintenance Recovery"
      - "Alpha Hunter Decision Refresh"
    types: [completed]

concurrency:
  group: alpha-hunter-action-board-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install advisory dependencies
        run: pip install pandas

      - name: Build CIO advisory layer
        run: python cio_advisory.py

      - name: Build privacy-safe one-page action board
        run: python action_board_summary.py

      - name: Commit advisory and action board
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/cio_advisory.csv output/cio_advisory.json output/action_board.md
          if ! git diff --cached --quiet; then
            git commit -m "publish alpha hunter CIO advisory $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
