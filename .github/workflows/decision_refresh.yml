name: Alpha Hunter Decision Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'input/edge_provenance.csv'
      - 'output/driver_activation_adjudicated_v3.csv'
      - 'decision_run.py'
      - 'decision_run_v2.py'
      - 'decision_state_v2.py'
      - 'snapshot_lineage_v2.py'
      - 'shadow_validation_v2.py'
      - 'launch_gate.py'
      - 'config/launch_policy.json'
      - 'config/frozen_strategy_v1.json'
      - 'config/portfolio_allocation_policy.json'
      - 'existing_position.py'
      - 'existing_position_v2.py'
      - 'position_alias_output.py'
      - 'position_alias_output_v2.py'
      - 'position_cio_advisory.py'
      - 'risk_regime.py'
      - 'portfolio_allocation_advisory.py'
      - 'global_alignment.py'
      - 'global_alignment_summary.py'
      - 'action_board_summary.py'
      - '.github/workflows/action_board_publish.yml'
      - '.github/workflows/decision_refresh.yml'

concurrency:
  group: alpha-hunter-v3-research-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decision-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regression-test decision and advisory contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Rebuild guarded V2 decision layer from latest validated causal source
        env:
          ALPHA_HUNTER_ACTIVATION_SOURCE: V3_VALIDATED
          ALPHA_HUNTER_RISK_POLICY_JSON: ${{ secrets.ALPHA_HUNTER_RISK_POLICY_JSON }}
          ALPHA_HUNTER_PORTFOLIO_JSON: ${{ secrets.ALPHA_HUNTER_PORTFOLIO_JSON }}
          ALPHA_HUNTER_POSITION_THESIS_JSON: ${{ secrets.ALPHA_HUNTER_POSITION_THESIS_JSON }}
        run: python decision_run_v2.py

      - name: Assert decision source and trace guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('output/decision_packet.json').read_text(encoding='utf-8'))
          a = p.get('activation_layer') or {}
          l = p.get('snapshot_lineage_layer') or {}
          s = p.get('state_lifecycle') or {}
          v = p.get('shadow_validation_layer') or {}
          source = a.get('source')
          print('decision source=', source, 'same_snapshot=', a.get('same_snapshot_v3'))
          if source not in {'V3_AUTONOMOUS_RESEARCH', 'CHATGPT_CHALLENGER_ADJUDICATION'}:
              raise SystemExit('No validated causal source')
          if not a.get('same_snapshot_v3') or not l.get('persisted_gate_matches_current_files'):
              raise SystemExit('Mixed/stale snapshot blocked')
          if s.get('same_session_rerun_can_consume_trigger') is not False:
              raise SystemExit('Same-session idempotence invariant missing')
          if v.get('future_data_cutoff_enforced') is not True:
              raise SystemExit('Shadow future-data cutoff invariant missing')
          PY

      - name: Publish alias-only existing-position actions with V2 contract guard
        env:
          ALPHA_HUNTER_RISK_POLICY_JSON: ${{ secrets.ALPHA_HUNTER_RISK_POLICY_JSON }}
          ALPHA_HUNTER_PORTFOLIO_JSON: ${{ secrets.ALPHA_HUNTER_PORTFOLIO_JSON }}
          ALPHA_HUNTER_POSITION_THESIS_JSON: ${{ secrets.ALPHA_HUNTER_POSITION_THESIS_JSON }}
          ALPHA_HUNTER_POSITION_ALIAS_JSON: ${{ secrets.ALPHA_HUNTER_POSITION_ALIAS_JSON }}
        run: python position_alias_output_v2.py

      - name: Publish existing-position CIO advisory
        env:
          ALPHA_HUNTER_RISK_POLICY_JSON: ${{ secrets.ALPHA_HUNTER_RISK_POLICY_JSON }}
          ALPHA_HUNTER_PORTFOLIO_JSON: ${{ secrets.ALPHA_HUNTER_PORTFOLIO_JSON }}
          ALPHA_HUNTER_POSITION_ALIAS_JSON: ${{ secrets.ALPHA_HUNTER_POSITION_ALIAS_JSON }}
        run: python position_cio_advisory.py

      - name: Commit refreshed public decision artifacts
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            output/shadow_journal.jsonl \
            output/decision_board.csv \
            output/decision_packet.json \
            output/decision_history.csv \
            output/shadow_audit.csv \
            output/shadow_validation.csv \
            output/shadow_validation_report.json
          if [ -e output/position_alias_actions.json ] || git ls-files --error-unmatch output/position_alias_actions.json >/dev/null 2>&1; then
            git add -A output/position_alias_actions.json
          fi
          if [ -e output/position_cio_advisory.json ] || git ls-files --error-unmatch output/position_cio_advisory.json >/dev/null 2>&1; then
            git add -A output/position_cio_advisory.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "refresh alpha hunter guarded v2 decision layer $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
