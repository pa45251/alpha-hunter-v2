name: Alpha Hunter Decision Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'input/edge_provenance.csv'
      - 'output/driver_activation_adjudicated_v3.csv'

concurrency:
  group: alpha-hunter-decision-refresh-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decision-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regression-test decision and advisory contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_decision_engine.py tests/test_decision_state_v2.py tests/test_snapshot_lineage_v2.py

      - name: Diagnose frozen V2 baseline (orders remain blocked by launch gate)
        continue-on-error: true
        run: python v2_freeze_guard.py

      - name: Rebuild guarded V2 decision layer from latest validated causal source
        env:
          ALPHA_HUNTER_ACTIVATION_SOURCE: V3_VALIDATED
        run: |
          python decision_run_v2.py
          python action_board_summary.py --refresh

      - name: Assert decision source and trace guards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('output/decision_packet.json').read_text(encoding='utf-8'))
          a = p.get('activation_layer') or {}
          l = p.get('snapshot_lineage_layer') or {}
          s = p.get('state_lifecycle') or {}
          v = p.get('shadow_validation_layer') or {}
          source = a.get('source')
          print('decision source=', source, 'same_snapshot=', a.get('same_snapshot_v3'))
          if source not in {'V3_AUTONOMOUS_RESEARCH', 'CHATGPT_CHALLENGER_ADJUDICATION'}:
              raise SystemExit('No validated causal source')
          if not a.get('same_snapshot_v3') or not l.get('persisted_gate_matches_current_files'):
              raise SystemExit('Mixed/stale snapshot blocked')
          if s.get('same_session_rerun_can_consume_trigger') is not False:
              raise SystemExit('Same-session idempotence invariant missing')
          PY

      - name: Build global risk regime for this canonical snapshot
        run: python risk_regime.py

      - name: Assert risk-regime lineage matches canonical manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('output/manifest.json').read_text(encoding='utf-8'))
          r = json.loads(Path('output/risk_regime.json').read_text(encoding='utf-8'))
          if m.get('status') != 'PASS':
              raise SystemExit('Canonical manifest not PASS')
          if r.get('source_run_id') != m.get('run_id'):
              raise SystemExit('Risk regime lineage mismatch')
          PY

      - name: Commit refreshed public decision artifacts
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          for path in output/position_cio_advisory.json output/position_alias_actions.json output/portfolio_allocation_v2.json output/portfolio_allocation_advisory.json output/cio_advisory.csv output/cio_advisory.json; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then git add -A "$path"; fi
          done
          git add \
            output/shadow_journal.jsonl \
            output/decision_board.csv \
            output/decision_packet.json \
            output/decision_history.csv \
            output/shadow_audit.csv \
            output/risk_regime.json
          git add -A output/opportunity_advisory.json output/action_board.md output/global_alignment_v2.csv output/global_alignment_v2.json output/entry_plans_v2.csv output/entry_plans_v2.json
          if ! git diff --cached --quiet; then
            git commit -m "refresh alpha hunter guarded v2 decision layer $(date -u +%F)"
            git push origin HEAD:main
          fi
