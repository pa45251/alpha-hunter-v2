name: Alpha Hunter Daily Scan

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. 22:55 UTC = 06:55 Asia/Taipei next day.
    # Mon-Fri Taiwan mornings correspond to Sun-Thu UTC evenings.
    - cron: '55 22 * * 0-4'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt
      - run: python daily_scan.py

      - name: Upload outputs as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-hunter-output
          path: output/
          retention-days: 30

      - name: Optional upload to Google Drive
        if: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' && secrets.GDRIVE_FOLDER_ID != '' }}
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python gdrive_upload.py

      - name: Commit snapshots/history back to repository
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && exit 0
          git commit -m "daily market snapshot $(date -u +%F)"
          git push
