name: Alpha Hunter Daily Scan

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC.
    # 22:55 UTC Sun-Thu = 06:55 Asia/Taipei Mon-Fri.
    - cron: '55 22 * * 0-4'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alpha Hunter scanner
        run: python daily_scan.py

      - name: Commit latest scanner outputs to repository
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && exit 0
          git commit -m "daily market snapshot $(date -u +%F)"
          git push
