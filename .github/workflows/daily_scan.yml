name: Alpha Hunter Daily Scan

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force a new scanner snapshot even if today's canonical snapshot already passed
        required: false
        default: true
        type: boolean
  push:
    branches: [main, "repair/**", "refactor/**"]
    paths:
      - '.alpha-hunter/scan_watchdog.json'
  schedule:
    # GitHub scheduled workflows can be delayed. Use staggered Asia/Taipei morning triggers.
    # UTC Sun-Thu maps to Taiwan Mon-Fri for these times.
    - cron: '20 22 * * 0-4'  # 06:20 Asia/Taipei
    - cron: '40 22 * * 0-4'  # 06:40 Asia/Taipei backup
    - cron: '0 23 * * 0-4'   # 07:00 Asia/Taipei final backup

concurrency:
  group: alpha-hunter-daily-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Decide whether a new canonical scan is required
        id: freshness_guard
        shell: bash
        run: |
          force_arg=""
          if [ "${{ github.ref_name }}" != "main" ]; then force_arg="--force"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            force_arg="--force"
          fi
          if ! python -c 'import json; from pathlib import Path; m=json.loads(Path("output/manifest.json").read_text()); names={f.get("name") for f in m.get("authoritative_files", [])}; assert "risk_regime.json" in names; r=json.loads(Path("output/risk_regime.json").read_text()); assert "position_trends" not in r'; then
            force_arg="--force"
          fi
          python automation_guard_v4.py --mode scheduled-scan $force_arg

      - name: Install dependencies
        if: steps.freshness_guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Validate scanner and manual-handoff contracts
        if: steps.freshness_guard.outputs.should_run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_REF_NAME: main
        run: >-
          python -m pytest -q
          tests/test_canonical_gate.py
          tests/test_snapshot_lineage_v2.py
          tests/test_risk_regime.py
          tests/test_daily_core_repair.py
          tests/test_v2_end_to_end_acceptance.py
          tests/test_market_data.py
          tests/test_global_sensors.py
          tests/test_broad_discovery.py
          tests/test_manual_research_queue.py

      - name: Run Alpha Hunter scanner
        if: steps.freshness_guard.outputs.should_run == 'true'
        run: python daily_scan.py

      - name: Commit scanner snapshot and manual research context
        if: steps.freshness_guard.outputs.should_run == 'true'
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            config/discovery_universe.csv \
            config/discovery_universe.json \
            output/global_scan_quality.json \
            output/discovery_snapshot.csv \
            output/discovery_research_queue.csv \
            output/manifest.json \
            output/gate_report.json \
            output/research_packet.json \
            output/market_snapshot.csv \
            output/market_snapshot.json \
            output/theme_breadth.csv \
            output/leader_registry.csv \
            output/feature_history.csv \
            output/taiwan_candidates.csv \
            output/taiwan_candidate_history.csv \
            output/taiwan_industry_breadth.csv \
            output/taiwan_universe.csv \
            output/causal_research_queue.csv \
            output/reverse_transmission_candidates.csv \
            output/structural_matches.csv \
            output/causal_graph_audit.csv \
            output/causal_driver_taxonomy.csv \
            output/structural_exposure_graph.csv \
            output/risk_regime.json \
            output/manual_global_peer_snapshot.csv \
            output/manual_driver_breadth.csv \
            output/manual_research_queue.csv \
            output/manual_research_handoff.json
          git diff --cached --quiet && exit 0
          git commit -m "alpha hunter scanner snapshot $(date -u +%F)"
          # Computed outputs are snapshot-bound. Never rebase them onto a newer run.
          git push origin HEAD:${{ github.ref_name }}

      - name: Record backup no-op
        if: steps.freshness_guard.outputs.should_run != 'true'
        run: echo "Canonical scanner snapshot already fresh; trigger intentionally performed no scan."
