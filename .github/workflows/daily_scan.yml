name: Alpha Hunter Daily Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily_scan.yml'
  schedule:
    # 22:55 UTC = 06:55 Asia/Taipei next day. Sun-Thu UTC = Mon-Fri Taiwan.
    - cron: '55 22 * * 0-4'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Run Alpha Hunter v2.6 scanner
        run: python daily_scan.py

      - name: Build v2.6.1 research handoff
        run: python research_handoff.py

      - name: Build v2.9 decision + private thesis/risk + exit + no-hindsight shadow validation
        env:
          ALPHA_HUNTER_RISK_POLICY_JSON: ${{ secrets.ALPHA_HUNTER_RISK_POLICY_JSON }}
          ALPHA_HUNTER_PORTFOLIO_JSON: ${{ secrets.ALPHA_HUNTER_PORTFOLIO_JSON }}
          ALPHA_HUNTER_POSITION_THESIS_JSON: ${{ secrets.ALPHA_HUNTER_POSITION_THESIS_JSON }}
        run: python decision_run.py

      - name: Commit canonical outputs
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            output/manifest.json \
            output/gate_report.json \
            output/research_packet.json \
            output/research_handoff.json \
            output/decision_board.csv \
            output/decision_packet.json \
            output/decision_history.csv \
            output/shadow_audit.csv \
            output/shadow_validation.csv \
            output/shadow_validation_report.json \
            output/market_snapshot.csv \
            output/market_snapshot.json \
            output/theme_breadth.csv \
            output/leader_registry.csv \
            output/feature_history.csv \
            output/taiwan_candidates.csv \
            output/taiwan_candidate_history.csv \
            output/taiwan_industry_breadth.csv \
            output/taiwan_universe.csv \
            output/causal_research_queue.csv \
            output/structural_matches.csv \
            output/causal_graph_audit.csv \
            output/causal_driver_taxonomy.csv \
            output/structural_exposure_graph.csv
          git diff --cached --quiet && exit 0
          git commit -m "alpha hunter v2.9 decision snapshot $(date -u +%F)"
          git push
