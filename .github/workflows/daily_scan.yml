name: Alpha Hunter Daily Scan

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force a new scanner snapshot even if today's canonical snapshot already passed
        required: false
        default: true
        type: boolean
  push:
    branches: [main, "repair/**"]
    paths:
      - '.alpha-hunter/scan_watchdog.json'
  schedule:
    # GitHub scheduled workflows can be delayed. Use staggered Asia/Taipei morning triggers.
    # UTC Sun-Thu maps to Taiwan Mon-Fri for these times.
    - cron: '20 22 * * 0-4'  # 06:20 Asia/Taipei
    - cron: '40 22 * * 0-4'  # 06:40 Asia/Taipei backup
    - cron: '0 23 * * 0-4'   # 07:00 Asia/Taipei final backup

concurrency:
  group: alpha-hunter-production-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Decide whether a new canonical scan is required
        id: freshness_guard
        shell: bash
        run: |
          force_arg=""
          if [ "${{ github.ref_name }}" != "main" ]; then force_arg="--force"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            force_arg="--force"
          fi
          # An older schema without sealed risk must be rebuilt during rollout.
          if ! python -c 'import json; from pathlib import Path; m=json.loads(Path("output/manifest.json").read_text()); assert any(f.get("name")=="risk_regime.json" for f in m.get("authoritative_files", [])); r=json.loads(Path("output/risk_regime.json").read_text()); assert "position_trends" not in r'; then
            force_arg="--force"
          fi
          python automation_guard_v4.py --mode scheduled-scan $force_arg

      - name: Install dependencies
        if: steps.freshness_guard.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Validate Daily Core contracts
        if: steps.freshness_guard.outputs.should_run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_REF_NAME: main
        run: python -m pytest -q tests/test_canonical_gate.py tests/test_snapshot_lineage_v2.py tests/test_risk_regime.py tests/test_daily_core_repair.py tests/test_v2_end_to_end_acceptance.py

      - name: Run Alpha Hunter v2.6 scanner
        if: steps.freshness_guard.outputs.should_run == 'true'
        run: python daily_scan.py

      - name: Build guarded Daily Core decision and action from sealed evidence
        if: steps.freshness_guard.outputs.should_run == 'true'
        env:
          ALPHA_HUNTER_ACTIVATION_SOURCE: AUTO
        run: |
          python decision_run_v2.py
          python action_board_summary.py --refresh

      - name: Build v2.6.1 research handoff
        continue-on-error: true
        if: steps.freshness_guard.outputs.should_run == 'true'
        run: python research_handoff.py

      - name: Commit canonical scanner snapshot for same-snapshot research
        if: steps.freshness_guard.outputs.should_run == 'true'
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          for path in output/position_cio_advisory.json output/position_alias_actions.json output/portfolio_allocation_v2.json output/portfolio_allocation_advisory.json output/cio_advisory.csv output/cio_advisory.json; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then git add -A "$path"; fi
          done
          # Publish the complete same-snapshot Daily Core atomically.
          git add \
            output/manifest.json \
            output/gate_report.json \
            output/research_packet.json \
            output/market_snapshot.csv \
            output/market_snapshot.json \
            output/theme_breadth.csv \
            output/leader_registry.csv \
            output/feature_history.csv \
            output/taiwan_candidates.csv \
            output/taiwan_candidate_history.csv \
            output/taiwan_industry_breadth.csv \
            output/taiwan_universe.csv \
            output/causal_research_queue.csv \
            output/structural_matches.csv \
            output/causal_graph_audit.csv \
            output/causal_driver_taxonomy.csv \
            output/structural_exposure_graph.csv
          git add -A output/decision_board.csv output/decision_packet.json output/decision_history.csv output/risk_regime.json output/global_alignment_v2.csv output/global_alignment_v2.json output/entry_plans_v2.json output/action_board.md output/shadow_journal.jsonl
          for path in output/research_handoff.json output/entry_plans_v2.csv output/entry_plan_trace_v2.csv output/shadow_audit.csv output/shadow_validation.csv output/shadow_validation_report.json; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then git add -A "$path"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m "alpha hunter canonical scanner snapshot $(date -u +%F)"
          # No rebase of computed output: a concurrent writer requires a fresh run.
          git push origin HEAD:${{ github.ref_name }}

      - name: Record backup no-op
        if: steps.freshness_guard.outputs.should_run != 'true'
        run: echo "Canonical snapshot already fresh; trigger intentionally performed no scan."
