name: Alpha Hunter Daily Scan

on:
  workflow_dispatch:
  schedule:
    # 22:17 UTC = 06:17 Asia/Taipei. Budget 40m scan + 45m research + 15m board; 43m slack to 08:40.
    - cron: '17 22 * * 0-4'

concurrency:
  group: alpha-hunter-daily-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Run Alpha Hunter v2.6 scanner
        run: python daily_scan.py

      - name: Build v2.6.1 research handoff
        run: python research_handoff.py

      - name: Commit canonical scanner snapshot for same-snapshot V3 research
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          # The scanner intentionally does NOT build or publish a decision here. A new scanner
          # run_id has no same-snapshot V3 research yet. Alpha Hunter v3 Autonomous Research is
          # triggered by this workflow's successful completion and owns the causal decision step.
          git add \
            output/manifest.json \
            output/gate_report.json \
            output/research_packet.json \
            output/research_handoff.json \
            output/market_snapshot.csv \
            output/market_snapshot.json \
            output/theme_breadth.csv \
            output/leader_registry.csv \
            output/feature_history.csv \
            output/taiwan_candidates.csv \
            output/taiwan_candidate_history.csv \
            output/taiwan_industry_breadth.csv \
            output/taiwan_universe.csv \
            output/causal_research_queue.csv \
            output/structural_matches.csv \
            output/causal_graph_audit.csv \
            output/causal_driver_taxonomy.csv \
            output/structural_exposure_graph.csv
          git diff --cached --quiet && exit 0
          git commit -m "alpha hunter canonical scanner snapshot $(date -u +%F)"
          git push
