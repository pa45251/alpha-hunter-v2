name: Alpha Hunter v3 Autonomous Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous_research_v3.yml'
      - 'RESEARCH_AGENT_PROMPT_V3.md'
      - 'research_ingest_v3.py'
      - 'research_contract_v3.py'

concurrency:
  group: alpha-hunter-v3-research-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify personal Copilot credential
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::Missing repository secret COPILOT_GITHUB_TOKEN. Personal repositories require a user-owned fine-grained PAT with the Copilot Requests account permission."
            exit 1
          fi

      - name: Build compact research handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          packet = json.loads(Path('output/research_packet.json').read_text(encoding='utf-8'))
          keep = (
              'research_priority', 'global_theme', 'driver_id', 'driver_label',
              'driver_scope', 'global_theme_strength_v2', 'global_latest_price_date',
              'activation_evidence_required', 'counter_evidence_required',
              'price_cannot_activate_driver'
          )
          compact = {
              'contract': packet.get('contract'),
              'run_id': packet.get('run_id'),
              'causal_rule': packet.get('causal_rule'),
              'research_targets': [
                  {k: row.get(k) for k in keep if k in row}
                  for row in (packet.get('research_queue_top30') or [])[:5]
              ],
          }
          Path('/tmp/research_handoff.json').write_text(
              json.dumps(compact, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          print('compact handoff bytes:', Path('/tmp/research_handoff.json').stat().st_size)
          print('target drivers:', [x.get('driver_id') for x in compact['research_targets']])
          PY

      - name: Run bounded autonomous causal research
        id: copilot_research
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set +e
          RESEARCH_PROMPT="$(cat RESEARCH_AGENT_PROMPT_V3.md)

          IMPORTANT INPUT OVERRIDE: The authoritative compact handoff is appended below. It contains exactly the first five targets from the canonical output/research_packet.json. Treat research_targets as the targets to research in order; the full packet is intentionally not attached because JSON attachments are unsupported by this CLI.

          --- BEGIN AUTHORITATIVE COMPACT RESEARCH HANDOFF ---
          $(cat /tmp/research_handoff.json)
          --- END AUTHORITATIVE COMPACT RESEARCH HANDOFF ---"

          copilot \
            -p "$RESEARCH_PROMPT" \
            -s \
            --available-tools='web_search,web_fetch' \
            --allow-all-urls \
            --deny-tool='write,shell,memory' \
            --no-ask-user \
            --max-ai-credits=35 \
            > output/research_result_v3.raw.txt \
            2> /tmp/copilot_research.err
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "Copilot CLI exited with code $code"
            sed -n '1,120p' /tmp/copilot_research.err || true
            echo '{}' > output/research_result_v3.raw.txt
            echo "Copilot research unavailable; deterministic ingest will fail closed to UNKNOWN."
          fi
          exit 0

      - name: Deterministic fail-closed research ingest
        run: python research_ingest_v3.py

      - name: Validate v3 contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_research_contract_v3.py

      - name: Remove unvalidated raw model output
        run: rm -f output/research_result_v3.raw.txt

      - name: Commit validated research artifact
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/research_result_v3.json
          if ! git diff --cached --quiet; then
            git commit -m "alpha hunter v3 autonomous research $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Assert validated research succeeded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/research_result_v3.json').read_text(encoding='utf-8'))
          status = data.get('status')
          valid = sum(1 for x in data.get('results', []) if x.get('confidence', 0) > 0 or x.get('state') != 'UNKNOWN')
          print(f'validated research status={status}; nontrivial_results={valid}/{len(data.get("results", []))}')
          if status != 'PASS':
              raise SystemExit(f'Validated research did not PASS: {status}; errors={data.get("errors")}')
          PY
