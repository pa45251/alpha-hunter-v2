name: Alpha Hunter v3 Autonomous Research

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Alpha Hunter Daily Scan"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/autonomous_research_v3.yml'
      - 'RESEARCH_AGENT_PROMPT_V3.md'
      - 'research_ingest_v3.py'
      - 'research_contract_v3.py'
      - 'research_quality_gate_v3.py'
      - 'research_activation_bridge_v3.py'
      - 'decision_run.py'

concurrency:
  group: alpha-hunter-v3-research-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Verify personal Copilot credential
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::Missing repository secret COPILOT_GITHUB_TOKEN."
            exit 1
          fi

      - name: Build compact research handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          packet = json.loads(Path('output/research_packet.json').read_text(encoding='utf-8'))
          keep = (
              'research_priority', 'global_theme', 'driver_id', 'driver_label',
              'driver_scope', 'global_theme_strength_v2', 'global_latest_price_date',
              'activation_evidence_required', 'counter_evidence_required',
              'price_cannot_activate_driver'
          )
          compact = {
              'contract': packet.get('contract'),
              'run_id': packet.get('run_id'),
              'causal_rule': packet.get('causal_rule'),
              'research_targets': [
                  {k: row.get(k) for k in keep if k in row}
                  for row in (packet.get('research_queue_top30') or [])[:5]
              ],
          }
          Path('/tmp/research_handoff.json').write_text(
              json.dumps(compact, ensure_ascii=False, separators=(',', ':')),
              encoding='utf-8'
          )
          print('compact handoff bytes:', Path('/tmp/research_handoff.json').stat().st_size)
          print('target drivers:', [x.get('driver_id') for x in compact['research_targets']])
          PY

      - name: Run bounded autonomous causal research
        id: copilot_research
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set +e
          RESEARCH_PROMPT="$(cat RESEARCH_AGENT_PROMPT_V3.md)

          IMPORTANT INPUT OVERRIDE: The authoritative compact handoff is appended below. Treat research_targets as the only targets to research, in order.

          --- BEGIN AUTHORITATIVE COMPACT RESEARCH HANDOFF ---
          $(cat /tmp/research_handoff.json)
          --- END AUTHORITATIVE COMPACT RESEARCH HANDOFF ---"
          copilot \
            -p "$RESEARCH_PROMPT" \
            -s \
            --available-tools='web_search,web_fetch' \
            --allow-all-urls \
            --deny-tool='write,shell,memory' \
            --no-ask-user \
            --max-ai-credits=30 \
            > output/research_result_v3.raw.txt \
            2> /tmp/copilot_research.err
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "Copilot CLI exited with code $code"
            sed -n '1,100p' /tmp/copilot_research.err || true
            echo '{}' > output/research_result_v3.raw.txt
          fi
          exit 0

      - name: Deterministic fail-closed research ingest
        run: python research_ingest_v3.py

      - name: Check first-pass research evidence quality
        id: quality_first
        continue-on-error: true
        run: python research_quality_gate_v3.py

      - name: Retry zero-source research once
        if: steps.quality_first.outcome == 'failure'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set +e
          RECOVERY_PROMPT="$(cat RESEARCH_AGENT_PROMPT_V3.md)

          RECOVERY PASS: The previous attempt produced no usable external-source coverage. Perform fresh web_search calls for EVERY target. Do not answer 'web access inadequate' before trying alternate exact-driver queries. Fetch promising sources and return source-backed evidence when it exists. UNKNOWN remains correct if evidence is insufficient, but this recovery pass must actually search. Use the exact same JSON schema and run_id.

          --- BEGIN AUTHORITATIVE COMPACT RESEARCH HANDOFF ---
          $(cat /tmp/research_handoff.json)
          --- END AUTHORITATIVE COMPACT RESEARCH HANDOFF ---"
          copilot \
            -p "$RECOVERY_PROMPT" \
            -s \
            --available-tools='web_search,web_fetch' \
            --allow-all-urls \
            --deny-tool='write,shell,memory' \
            --no-ask-user \
            --max-ai-credits=15 \
            > output/research_result_v3.raw.txt \
            2> /tmp/copilot_research_retry.err
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "Copilot retry exited with code $code"
            sed -n '1,100p' /tmp/copilot_research_retry.err || true
            echo '{}' > output/research_result_v3.raw.txt
          fi
          exit 0

      - name: Re-ingest recovery research
        if: steps.quality_first.outcome == 'failure'
        run: python research_ingest_v3.py

      - name: Enforce research evidence quality
        run: python research_quality_gate_v3.py

      - name: Build same-snapshot v3 activation bridge
        run: python research_activation_bridge_v3.py

      - name: Run downstream decision layer from v3 research
        env:
          ALPHA_HUNTER_ACTIVATION_SOURCE: V3_VALIDATED
          ALPHA_HUNTER_RISK_POLICY_JSON: ${{ secrets.ALPHA_HUNTER_RISK_POLICY_JSON }}
          ALPHA_HUNTER_PORTFOLIO_JSON: ${{ secrets.ALPHA_HUNTER_PORTFOLIO_JSON }}
          ALPHA_HUNTER_POSITION_THESIS_JSON: ${{ secrets.ALPHA_HUNTER_POSITION_THESIS_JSON }}
        run: python decision_run.py

      - name: Validate v3 contract and bridge tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q tests/test_research_contract_v3.py tests/test_research_activation_bridge_v3.py tests/test_research_quality_gate_v3.py

      - name: Remove unvalidated raw model output
        run: rm -f output/research_result_v3.raw.txt

      - name: Commit validated research and decision artifacts
        run: |
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            output/research_result_v3.json \
            output/driver_activation_v3.csv \
            output/decision_board.csv \
            output/decision_packet.json \
            output/decision_history.csv \
            output/shadow_audit.csv \
            output/shadow_validation.csv \
            output/shadow_validation_report.json
          if ! git diff --cached --quiet; then
            git commit -m "alpha hunter v3 research to decision $(date -u +%F)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Assert validated research and decision bridge succeeded
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          research = json.loads(Path('output/research_result_v3.json').read_text(encoding='utf-8'))
          decision = json.loads(Path('output/decision_packet.json').read_text(encoding='utf-8'))
          activation = decision.get('activation_layer') or {}
          total_sources = sum(int(x.get('source_count', 0) or 0) for x in research.get('results', []))
          print(f"validated research status={research.get('status')} total_sources={total_sources}")
          print(f"decision activation source={activation.get('source')} same_snapshot_v3={activation.get('same_snapshot_v3')} accepted={activation.get('accepted_activation_rows')}")
          if research.get('status') != 'PASS' or total_sources <= 0:
              raise SystemExit('Validated research did not meet evidence quality gate')
          if activation.get('source') != 'V3_AUTONOMOUS_RESEARCH' or not activation.get('same_snapshot_v3'):
              raise SystemExit(f'Decision layer did not consume same-snapshot V3 research: {activation}')
          PY
