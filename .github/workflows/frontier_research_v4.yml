name: Alpha Hunter V4 OpenAI Frontier Research

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Alpha Hunter v3 Autonomous Research"]
    types: [completed]
  push:
    branches: ["repair/**"]
    paths:
      - '.github/workflows/frontier_research_v4.yml'
      - 'deep_review_admission_v4.py'
      - 'openai_candidate_challenger_v4.py'
      - 'candidate_review_merge_v4.py'
      - 'final_action_board_v4.py'
      - 'tests/test_deep_review_v4.py'

concurrency:
  group: alpha-hunter-v4-final-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  frontier:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          fetch-depth: 0

      - name: Capture immutable input HEAD
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build deterministic deep-review admission packet
        id: admission
        run: |
          python deep_review_admission_v4.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          packet=json.loads(Path('output/deep_review_packet_v4.json').read_text(encoding='utf-8'))
          if packet.get('status') != 'PASS':
              raise SystemExit('DEEP_REVIEW_ADMISSION_NOT_READY:' + str(packet.get('status')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('target_count=' + str(len(packet.get('targets') or [])) + '\n')
          print('deep review target_count=', len(packet.get('targets') or []))
          PY

      - name: Check OpenAI provider when deep targets exist
        id: provider
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ steps.admission.outputs.target_count }}" = "0" ]; then
            echo "enabled=not_required" >> "$GITHUB_OUTPUT"
            echo "No deep-review target; provider call is not required."
          elif [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Deep-review targets exist but OPENAI_API_KEY is absent. Frontier lane is NOT validated."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail closed when admitted targets cannot be reviewed
        if: steps.admission.outputs.target_count != '0' && steps.provider.outputs.enabled != 'true'
        run: |
          echo "::error::Admitted deep-review targets were not reviewed by the configured OpenAI provider."
          exit 2

      - name: Run bounded candidate challenger
        if: steps.admission.outputs.target_count == '0' || steps.provider.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_FRONTIER_MODEL: ${{ vars.OPENAI_FRONTIER_MODEL || 'gpt-5.6' }}
          OPENAI_FRONTIER_REASONING_EFFORT: ${{ vars.OPENAI_FRONTIER_REASONING_EFFORT || 'high' }}
        run: |
          python openai_candidate_challenger_v4.py \
            --packet output/deep_review_packet_v4.json \
            --out output/candidate_challenger_v4.json

      - name: Deterministically merge challenger without upward override
        if: steps.admission.outputs.target_count == '0' || steps.provider.outputs.enabled == 'true'
        run: |
          python candidate_review_merge_v4.py
          python final_action_board_v4.py

      - name: Validate challenger and no-upgrade contracts
        if: steps.admission.outputs.target_count == '0' || steps.provider.outputs.enabled == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_deep_review_v4.py tests/test_entry_risk.py tests/test_snapshot_lineage_v2.py

      - name: Publish snapshot-bound final review artifacts
        if: steps.admission.outputs.target_count == '0' || steps.provider.outputs.enabled == 'true'
        env:
          TARGET_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse origin/$TARGET_BRANCH)" != "$BASE_SHA" ]; then
            echo "::error::Branch advanced after deep-review inputs were read; refusing mixed-snapshot publish."
            exit 1
          fi
          git config user.name "alpha-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            output/deep_review_packet_v4.json \
            output/candidate_challenger_v4.json \
            output/final_candidate_review_v4.json \
            output/final_action_board_v4.md
          git diff --cached --quiet && exit 0
          git commit -m "alpha hunter v4 final candidate review $(date -u +%F)"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Frontier lane status
        if: always()
        run: |
          echo "deep_targets=${{ steps.admission.outputs.target_count }}"
          echo "openai_provider=${{ steps.provider.outputs.enabled }}"
          echo "A successful no-target run means no model call was necessary; it does not mean candidates were reviewed."
